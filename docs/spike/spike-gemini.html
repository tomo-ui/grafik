<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spike Gemini</title>
    <style>
      body {
        font:
          16px/1.4 system-ui,
          sans-serif;
        margin: 0;
        padding: 16px;
        max-width: 640px;
      }
      label {
        display: block;
        margin: 12px 0 4px;
        font-weight: 600;
      }
      input,
      select,
      button,
      textarea {
        font: inherit;
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
      }
      button {
        margin-top: 16px;
        background: #007aff;
        color: #fff;
        border: 0;
        border-radius: 10px;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #f2f2f7;
        padding: 12px;
        border-radius: 10px;
      }
      .ok {
        color: #1a8f3a;
      }
      .bad {
        color: #c62828;
      }
    </style>
  </head>
  <body>
    <h1>Spike Gemini (z przeglądarki)</h1>
    <p>
      Sprawdza z prawdziwego urządzenia: (a) czy CORS działa bez proxy, (b) czy model przyjmuje
      <code>responseSchema</code> i <code>thinkingConfig</code>, (c) czas odpowiedzi. Klucz zostaje
      w tej stronie (nie jest nigdzie zapisywany). Wyniki przepisz do
      <code>docs/spike-gemini.md</code>.
    </p>

    <label for="key">Klucz API (tymczasowy, najlepiej nowy)</label>
    <input id="key" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" />

    <label for="model">Model</label>
    <input id="model" value="gemini-flash-latest" autocapitalize="none" spellcheck="false" />

    <label for="file">Zdjęcie grafiku</label>
    <input id="file" type="file" accept="image/*" />

    <button id="run">Uruchom test</button>
    <pre id="out">Gotowe do testu.</pre>

    <script>
      const $ = (id) => document.getElementById(id);
      const out = $('out');
      const log = (msg, cls) => {
        const line = document.createElement('div');
        if (cls) line.className = cls;
        line.textContent = msg;
        out.appendChild(line);
      };
      const toBase64 = (file) =>
        new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(String(r.result).split(',')[1]);
          r.onerror = rej;
          r.readAsDataURL(file);
        });

      const SCHEMA = {
        type: 'object',
        properties: {
          people: {
            type: 'array',
            items: {
              type: 'object',
              properties: {
                nameAsWritten: { type: 'string' },
                entries: {
                  type: 'array',
                  items: {
                    type: 'object',
                    properties: {
                      date: { type: 'string' },
                      rawCell: { type: 'string' },
                      kind: { type: 'string', enum: ['work', 'off', 'vacation', 'sick', 'other'] },
                      start: { type: 'string', nullable: true },
                      end: { type: 'string', nullable: true },
                      confidence: { type: 'number' },
                    },
                    required: ['date', 'rawCell', 'kind', 'confidence'],
                  },
                },
              },
              required: ['nameAsWritten', 'entries'],
            },
          },
        },
        required: ['people'],
      };
      const PROMPT =
        'Extract the staff work schedule from this photo (Polish). Return one entry per person per non-empty day: date YYYY-MM-DD, rawCell, kind, start/end HH:MM or null, confidence 0-1.';

      async function call(label, generationConfig, image, key, model) {
        const t0 = performance.now();
        let res;
        try {
          res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
              body: JSON.stringify({
                contents: [
                  {
                    parts: [
                      { text: PROMPT },
                      { inline_data: { mime_type: image.type, data: image.data } },
                    ],
                  },
                ],
                generationConfig,
              }),
            },
          );
        } catch (e) {
          log(`[${label}] BŁĄD SIECI / CORS: ${e}`, 'bad');
          return null;
        }
        const ms = Math.round(performance.now() - t0);
        const body = await res.json().catch(() => ({}));
        if (res.ok) log(`[${label}] HTTP ${res.status} w ${ms} ms — OK`, 'ok');
        else log(`[${label}] HTTP ${res.status} w ${ms} ms — ${body?.error?.message ?? ''}`, 'bad');
        return { ok: res.ok, body, ms };
      }

      $('run').onclick = async () => {
        out.textContent = '';
        const key = $('key').value.trim();
        const model = $('model').value.trim();
        const file = $('file').files[0];
        if (!key || !file) return log('Podaj klucz i zdjęcie.', 'bad');
        log(`UA: ${navigator.userAgent}`);
        const image = { type: file.type || 'image/jpeg', data: await toBase64(file) };
        log(`Obraz: ${file.type}, ${(file.size / 1024).toFixed(0)} kB`);

        const base = { temperature: 0, responseMimeType: 'application/json' };
        const a = await call(
          '1 schemat + thinkingLevel=low',
          { ...base, responseSchema: SCHEMA, thinkingConfig: { thinkingLevel: 'low' } },
          image,
          key,
          model,
        );
        const b = a?.ok
          ? null
          : await call(
              '2 schemat bez thinking',
              { ...base, responseSchema: SCHEMA },
              image,
              key,
              model,
            );
        const c = a?.ok || b?.ok ? null : await call('3 bez schematu', base, image, key, model);
        const best = [a, b, c].find((r) => r?.ok);
        if (best) {
          const text =
            best.body?.candidates?.[0]?.content?.parts?.map((p) => p.text).join('') ?? '';
          log('--- odpowiedź (początek) ---');
          log(text.slice(0, 1500));
          try {
            JSON.parse(text);
            log('JSON poprawny', 'ok');
          } catch {
            log('JSON niepoprawny', 'bad');
          }
        }
      };
    </script>
  </body>
</html>
